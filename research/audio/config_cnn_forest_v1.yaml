model_version: threat-cnn-forest-v1
labels:
  - chainsaw
  - gunshot
  - vehicle
  - fire_crackle
  - background_unknown
model:
  architecture: cnn
  dropout: 0.1
audio:
  sample_rate: 16000
  clip_seconds: 4.0
  n_mels: 64
training:
  batch_size: 16
  epochs: 16
  learning_rate: 0.001
  seed: 57
  device: auto
  class_weighting: false
  weighted_sampler: true
  sampler_weight_power: 0.75
  sampler_label_multiplier_mode: multiply
  sampler_label_multipliers:
    background_unknown: 2.5
    chainsaw: 2.5
    gunshot: 3.0
    vehicle: 2.0
    fire_crackle: 2.0
  sampler_source_multipliers:
    rfcx_frugalai: 3.0
    fsc22: 2.0
    kaggle_chainsaw_rainforest: 1.5
    kaggle_forest_wildfire: 1.5
    kaggle_gunshot: 1.0
    kaggle_vehicle_type: 0.8
  checkpoint_each_epoch: true
  scheduler: none
  progress_log_interval: 100
loss:
  name: cross_entropy
evaluation:
  threshold_step: 0.05
  min_precision:
    chainsaw: 0.7
    gunshot: 0.75
    vehicle: 0.65
    fire_crackle: 0.65
    background_unknown: 0.8
  max_background_fp_rate:
    chainsaw: 0.03
    gunshot: 0.02
    vehicle: 0.035
    fire_crackle: 0.03
  selection:
    background_false_positive_penalty: 1.5
    min_recall:
      chainsaw: 0.65
      gunshot: 0.55
      vehicle: 0.4
      fire_crackle: 0.5
augmentation:
  enabled: true
  gain_min: 0.8
  gain_max: 1.2
  noise_std: 0.003
  max_shift_fraction: 0.08
  max_time_mask_frames: 12
  max_freq_mask_bins: 8
paths:
  manifest: data/audio/manifests/threat_manifest_forest_v1.csv
  artifact_dir: models/audio/threat_cnn_forest_v1
