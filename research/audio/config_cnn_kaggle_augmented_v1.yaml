model_version: threat-cnn-kaggle-augmented-v1
labels:
  - chainsaw
  - gunshot
  - vehicle
  - fire_crackle
  - background_unknown
model:
  architecture: cnn
  dropout: 0.1
audio:
  sample_rate: 16000
  clip_seconds: 4.0
  n_mels: 64
training:
  batch_size: 16
  epochs: 16
  learning_rate: 0.001
  seed: 44
  device: auto
  class_weighting: false
  weighted_sampler: true
  sampler_weight_power: 0.75
  sampler_source_multipliers:
    hard_negative: 4.0
    kaggle_chainsaw_rainforest: 4.0
  checkpoint_each_epoch: true
  scheduler: none
  progress_log_interval: 100
loss:
  name: cross_entropy
evaluation:
  threshold_step: 0.05
  min_precision:
    chainsaw: 0.55
    gunshot: 0.75
    vehicle: 0.6
    fire_crackle: 0.6
    background_unknown: 0.8
  max_background_fp_rate:
    chainsaw: 0.03
    gunshot: 0.02
    vehicle: 0.04
    fire_crackle: 0.03
  selection:
    background_false_positive_penalty: 1.2
    min_recall:
      chainsaw: 0.55
      gunshot: 0.55
      vehicle: 0.45
      fire_crackle: 0.55
augmentation:
  enabled: true
  gain_min: 0.8
  gain_max: 1.2
  noise_std: 0.003
  max_shift_fraction: 0.08
  max_time_mask_frames: 12
  max_freq_mask_bins: 8
paths:
  manifest: data/audio/manifests/threat_manifest_kaggle_augmented_v1.csv
  artifact_dir: models/audio/threat_cnn_kaggle_augmented_v1
