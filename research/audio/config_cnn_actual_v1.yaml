model_version: threat-cnn-actual-v1
labels:
  - chainsaw
  - gunshot
  - vehicle
  - fire_crackle
  - background_unknown
model:
  architecture: cnn
  dropout: 0.1
audio:
  sample_rate: 16000
  clip_seconds: 4.0
  n_mels: 64
training:
  batch_size: 16
  epochs: 16
  learning_rate: 0.001
  seed: 42
  device: auto
  class_weighting: false
  weighted_sampler: true
  sampler_weight_power: 0.75
  sampler_label_multipliers:
    chainsaw: 18.0
    gunshot: 10.0
    vehicle: 6.0
    fire_crackle: 18.0
    background_unknown: 1.25
  sampler_source_multipliers:
    fsd50k: 1.25
    hard_negative: 2.0
  checkpoint_each_epoch: true
  scheduler: none
loss:
  name: cross_entropy
evaluation:
  threshold_step: 0.05
  min_precision:
    chainsaw: 0.45
    gunshot: 0.75
    vehicle: 0.55
    fire_crackle: 0.55
    background_unknown: 0.75
  max_background_fp_rate:
    chainsaw: 0.03
    gunshot: 0.01
    vehicle: 0.04
    fire_crackle: 0.03
  selection:
    background_false_positive_penalty: 1.0
    min_recall:
      chainsaw: 0.5
      gunshot: 0.4
      vehicle: 0.35
      fire_crackle: 0.5
augmentation:
  enabled: true
  gain_min: 0.8
  gain_max: 1.2
  noise_std: 0.003
  max_shift_fraction: 0.08
  max_time_mask_frames: 12
  max_freq_mask_bins: 8
paths:
  manifest: data/audio/manifests/threat_manifest_training_actual.csv
  artifact_dir: models/audio/threat_cnn_actual_v2
