services:
  - type: web
    name: canopy-api
    env: docker
    dockerfilePath: api/Dockerfile
    dockerContext: api
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: AUDIO_STORAGE_PATH
        value: /tmp/canopy-audio
      - key: CORS_ORIGINS
        sync: false
      - key: PORT
        value: 8000
