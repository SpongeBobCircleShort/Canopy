name: Keploy API tests

# Keploy captures traffic with eBPF, which is Linux-only, so this is the one
# place it can run natively for a team on macOS. If `keploy/` test cases are
# committed the job replays them as a regression suite; if not, it records them
# first from scripts/keploy_traffic.py and uploads them to be committed.

on:
  push:
    branches: [main, feat/keploy-api-tests]
  pull_request:
  workflow_dispatch:

jobs:
  keploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install API dependencies
        run: |
          pip install -r api/requirements.txt
          pip install pyyaml

      - name: Install Keploy
        run: |
          curl --silent -O -L https://keploy.io/install.sh
          source install.sh
          keploy --version

      - name: Configure Keploy noise fields
        run: |
          keploy config --generate
          python scripts/keploy_config.py

      - name: Check for committed test cases
        id: cases
        run: |
          if compgen -G "keploy/test-set-*" > /dev/null; then
            echo "recorded=true" >> "$GITHUB_OUTPUT"
            echo "Found committed test cases; replaying them."
          else
            echo "recorded=false" >> "$GITHUB_OUTPUT"
            echo "No committed test cases; recording a fresh set."
          fi

      - name: Record API traffic
        if: steps.cases.outputs.recorded == 'false'
        run: |
          chmod +x scripts/keploy_app.sh
          rm -f api/keploy.db
          sudo -E env PATH="$PATH" keploy record -c "./scripts/keploy_app.sh" --delay 20 &
          for _ in $(seq 1 60); do
            curl -sf http://localhost:8000/api/health > /dev/null && break
            sleep 2
          done
          python scripts/keploy_traffic.py --base-url http://localhost:8000
          sleep 5
          sudo pkill -INT -f "keploy record" || true
          sleep 10
          if ! compgen -G "keploy/test-set-*" > /dev/null; then
            echo "::error::Recording produced no test cases."
            exit 1
          fi
          echo "Recorded: $(find keploy -name 'test-*.yaml' | wc -l) cases"

      - name: Upload recorded cases
        if: steps.cases.outputs.recorded == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: keploy-recorded-tests
          path: keploy/

      - name: Replay recorded traffic
        run: |
          chmod +x scripts/keploy_app.sh
          rm -f api/keploy.db
          sudo -E env PATH="$PATH" keploy test -c "./scripts/keploy_app.sh" --delay 20

      - name: Upload Keploy reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keploy-reports
          path: keploy/reports/
          if-no-files-found: ignore
